[package]
name = "rvp-cli"
description = "RVP server binary: config load, run media server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "rvp-server"
path = "src/main.rs"

[dependencies]
rvp-server = { path = "../rvp-server" }
rvp-auth = { path = "../rvp-auth" }
rvp-metrics = { path = "../rvp-metrics" }
rvp-directory = { path = "../rvp-directory" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
redis = { workspace = true }
futures-util = "0.3"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
