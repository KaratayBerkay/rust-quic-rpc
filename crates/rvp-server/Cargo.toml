[package]
name = "rvp-server"
description = "RVP media server: QUIC endpoint, control handshake, rooms, SFU forwarder"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# TEST ONLY: skip server-cert verification for loopback tests/demo.
test-utils = []

[dependencies]
bytes = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
rvp-proto = { path = "../rvp-proto" }
rvp-auth = { path = "../rvp-auth" }
rvp-metrics = { path = "../rvp-metrics" }
wtransport = "0.7"
tokio-tungstenite = { workspace = true }
futures-util = "0.3"

[dev-dependencies]
jsonwebtoken = { workspace = true }
serde = { workspace = true }

[[test]]
name = "loopback"
required-features = ["test-utils"]

[[test]]
name = "wt_loopback"
required-features = ["test-utils"]

[[test]]
name = "ws_loopback"
required-features = ["test-utils"]

[[test]]
name = "hardening"
required-features = ["test-utils"]

[[test]]
name = "keyupdate"
required-features = ["test-utils"]

[[test]]
name = "revocation"
required-features = ["test-utils"]
