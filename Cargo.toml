[workspace]
resolver = "2"
members = [
    "crates/rvp-proto",
    "crates/rvp-auth",
    "crates/rvp-crypto",
    "crates/rvp-server",
    "crates/rvp-cli",
    "crates/rvp-metrics",
    "crates/rvp-loadgen",
    "plugins/rvp_flutter_quic/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
rust-version = "1.85"
repository = "https://github.com/KaratayBerkay/rust-quic-rpc"

[workspace.dependencies]
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
aes-gcm = "0.10"
dashmap = "6"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1
