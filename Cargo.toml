[workspace]
resolver = "2"
members = ["crates/rvp-proto", "crates/rvp-server", "crates/rvp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/KaratayBerkay/rust-quic-rpc"

[workspace.dependencies]
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
