# Local Postgres for the RVP control plane (plan §5).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rvp
      POSTGRES_PASSWORD: rvp
      POSTGRES_DB: rvp
    ports:
      - '5432:5432'
    volumes:
      - rvp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rvp -d rvp']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rvp-pgdata:
