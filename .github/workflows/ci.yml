name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  commitlint:
    name: Commit messages (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ---- Phase gates: activate automatically when code lands ----

  rust:
    name: Rust (crates)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('crates/**/Cargo.toml', 'Cargo.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter:
    name: Flutter (apps/flutter)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/flutter/pubspec.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/flutter
      - run: flutter analyze
        working-directory: apps/flutter
      - run: flutter test
        working-directory: apps/flutter

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint --if-present
        working-directory: apps/web
      - run: npm run build --if-present
        working-directory: apps/web

  nest:
    name: NestJS (services/nest)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('services/nest/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/nest/package-lock.json
      - run: npm ci
        working-directory: services/nest
      - run: npm run lint --if-present
        working-directory: services/nest
      - run: npm run test --if-present
        working-directory: services/nest
      - run: npm run build --if-present
        working-directory: services/nest
