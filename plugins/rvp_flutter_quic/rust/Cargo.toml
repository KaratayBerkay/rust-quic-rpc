[package]
name = "rvp_flutter_quic"
description = "In-house RVP QUIC transport plugin (flutter_rust_bridge over quinn)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
rvp-crypto = { path = "../../../crates/rvp-crypto" }

[dev-dependencies]
rvp-proto = { path = "../../../crates/rvp-proto" }
rvp-auth = { path = "../../../crates/rvp-auth" }
rvp-server = { path = "../../../crates/rvp-server" }
rcgen = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = "1"
getrandom = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
